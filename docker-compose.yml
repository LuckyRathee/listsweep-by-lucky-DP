# Single-host deployment. The store is SQLite on a named volume (PostgreSQL is not implemented).
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      EMAIL_VERIFIER_ENV: production
      EMAIL_VERIFIER_ADMIN_EMAIL: ${EMAIL_VERIFIER_ADMIN_EMAIL:?set the first admin's email in .env}
      EMAIL_VERIFIER_ADMIN_PASSWORD: ${EMAIL_VERIFIER_ADMIN_PASSWORD:?set the first admin's password in .env}
      EMAIL_VERIFIER_API_KEY: ${EMAIL_VERIFIER_API_KEY:-}
      EMAIL_VERIFIER_DB: /data/jobs.sqlite3
      # The address shown in the API guides, for example https://listsweep.example.com
      EMAIL_VERIFIER_PUBLIC_URL: ${VERIFIER_PUBLIC_URL:-}
      EMAIL_VERIFIER_RATE_LIMIT_PER_MINUTE: ${EMAIL_VERIFIER_RATE_LIMIT_PER_MINUTE:-120}
      # Mailbox (SMTP) checks stay off until you set these in .env (and AWS has lifted its port-25 block).
      VERIFIER_SMTP_ENABLED: ${VERIFIER_SMTP_ENABLED:-false}
      VERIFIER_HELO_DOMAIN: ${VERIFIER_HELO_DOMAIN:-}
      VERIFIER_MAIL_FROM: ${VERIFIER_MAIL_FROM:-}
      # Which proxy addresses may report the visitor's real IP. Set to * in .env only when the app is reachable
      # solely through the HTTPS proxy below (so the sign-in throttle and activity log see the real address).
      FORWARDED_ALLOW_IPS: ${VERIFIER_TRUSTED_PROXY:-127.0.0.1}
    volumes:
      - verifier_data:/data
    ports:
      # Loopback only by default. Set VERIFIER_BIND=0.0.0.0 in .env only when a firewall limits who can reach port 8080.
      - "${VERIFIER_BIND:-127.0.0.1}:8080:8080"

  # Optional HTTPS front door: set COMPOSE_PROFILES=https and VERIFIER_DOMAIN (and/or VERIFIER_HTTPS_HOST) in .env.
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VERIFIER_DOMAIN: ${VERIFIER_DOMAIN:-localhost}
      VERIFIER_HTTPS_HOST: ${VERIFIER_HTTPS_HOST:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  verifier_data:
  caddy_data:
  caddy_config:
